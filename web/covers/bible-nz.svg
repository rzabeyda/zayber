<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1406"/>
      <stop offset="1" stop-color="#050403"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#b8860b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b8860b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset=".5" stop-color="#f1c04f"/>
      <stop offset="1" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="720" fill="url(#bg)"/>
  <rect width="600" height="720" fill="url(#glow)"/>
  <!-- лучи света -->
  <g stroke="#f1c04f" stroke-opacity=".22" stroke-width="3" transform="translate(300 290)">
    <line x1="0" y1="0" x2="0" y2="-360"/><line x1="0" y1="0" x2="120" y2="-340"/><line x1="0" y1="0" x2="-120" y2="-340"/>
    <line x1="0" y1="0" x2="240" y2="-270"/><line x1="0" y1="0" x2="-240" y2="-270"/>
    <line x1="0" y1="0" x2="330" y2="-150"/><line x1="0" y1="0" x2="-330" y2="-150"/>
    <line x1="0" y1="0" x2="360" y2="0"/><line x1="0" y1="0" x2="-360" y2="0"/>
  </g>
  <!-- крест -->
  <g transform="translate(300 290)">
    <rect x="-22" y="-165" width="44" height="330" rx="6" fill="url(#gold)"/>
    <rect x="-105" y="-75" width="210" height="44" rx="6" fill="url(#gold)"/>
  </g>
  <!-- открытая книга -->
  <g fill="none" stroke="#f1c04f" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 40)">
    <path d="M300 520 C240 490 150 490 90 510 L90 600 C150 580 240 580 300 610 C360 580 450 580 510 600 L510 510 C450 490 360 490 300 520 Z"/>
    <path d="M300 520 L300 610"/>
  </g>
</svg>
